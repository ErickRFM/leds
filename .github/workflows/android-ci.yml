name: Android + ESP32 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unit tests
        working-directory: android
        run: gradle testDebugUnitTest --stacktrace
      - name: Android lint
        working-directory: android
        run: gradle lintDebug --stacktrace
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rgb-controller-debug
          if-no-files-found: error
          path: android/app/build/outputs/apk/debug/app-debug.apk

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 board
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.0.7 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Compile firmware
        run: arduino-cli compile --fqbn esp32:esp32:esp32 firmware/esp32_rgb
