name: Android + ESP32 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only the newest version of a PR branch needs an expensive Android/ESP32 build.
# Different branches and main retain their independent CI records.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-board-profile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell ESP32 board profile (no build or flash)
        shell: powershell
        run: .\\scripts\\test-board-profile.ps1

      - name: Verify imported Arduino sketch USB safety gate (no flash)
        shell: powershell
        run: .\scripts\test-user-sketch-guards.ps1

      - name: Verify Arduino CLI discovery and actionable preflight errors
        shell: powershell
        run: .\scripts\test-arduino-cli-discovery.ps1

  firmware-core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify board profile consistency
        run: python3 scripts/check-board-profile.py
      - name: BLE write queue timeout contract
        run: python3 scripts/check-ble-write-path.py
      - name: Contract regression (BLE RGB V1 + V2 core)
        run: python3 scripts/check-contracts.py
      - name: Host unit tests (no ESP32 required)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/firmware_core_test.cpp -o /tmp/firmware_core_test
          /tmp/firmware_core_test
      - name: V4 bounded RGB script runtime host tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/rgb_script_runtime_test.cpp -o /tmp/rgb_script_runtime_test
          /tmp/rgb_script_runtime_test
      - name: Command arbiter host tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/compi_arbiter_test.cpp -o /tmp/compi_arbiter_test
          /tmp/compi_arbiter_test
      - name: Capability negotiation host tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/compi_capabilities_test.cpp -o /tmp/compi_capabilities_test
          /tmp/compi_capabilities_test
      - name: OTA preflight host tests (no OTA flashing)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/compi_ota_preflight_test.cpp -o /tmp/compi_ota_preflight_test
          /tmp/compi_ota_preflight_test
      - name: RGB automation clock host tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/rgb_automation_clock_test.cpp -o /tmp/rgb_automation_clock_test
          /tmp/rgb_automation_clock_test
      - name: Environmental RGB policy host tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/environmental_rgb_policy_test.cpp -o /tmp/environmental_rgb_policy_test
          /tmp/environmental_rgb_policy_test
      - name: BLE LDR calibration and owner gate host tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/ble_ldr_calibration_test.cpp -o /tmp/ble_ldr_calibration_test
          /tmp/ble_ldr_calibration_test
      - name: BLE sensor snapshots and owner gate host tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/ble_snapshot_framer_test.cpp -o /tmp/ble_snapshot_framer_test
          /tmp/ble_snapshot_framer_test
      - name: BLE environmental owner-gate host tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/ble_environmental_command_test.cpp -o /tmp/ble_environmental_command_test
          /tmp/ble_environmental_command_test
      - name: BLE security policy host tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/ble_security_policy_test.cpp -o /tmp/ble_security_policy_test
          /tmp/ble_security_policy_test
      - name: Owner NVS fresh-install and corruption regression
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -DARDUINO=1 -I tests/stubs tests/nvs_owner_first_boot_test.cpp -o /tmp/nvs_owner_first_boot_test
          /tmp/nvs_owner_first_boot_test
      - name: BLE owner enrollment host tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/owner_enrollment_test.cpp -o /tmp/owner_enrollment_test
          /tmp/owner_enrollment_test
      - name: BLE owner enrollment frame codec host tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/owner_enrollment_frames_test.cpp -o /tmp/owner_enrollment_frames_test
          /tmp/owner_enrollment_frames_test
      - name: BLE session key schedule host tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I tests tests/session_key_schedule_test.cpp -o /tmp/session_key_schedule_test
          /tmp/session_key_schedule_test
      - name: Unified command authorization host tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/command_authorization_test.cpp -o /tmp/command_authorization_test
          /tmp/command_authorization_test
      - name: SEG.3 adversarial security integration host tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I tests tests/security_adversarial_test.cpp -o /tmp/security_adversarial_test
          /tmp/security_adversarial_test
      - name: Owner enrollment session host tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I tests tests/owner_enrollment_session_test.cpp -o /tmp/owner_enrollment_session_test
          /tmp/owner_enrollment_session_test
      - name: Experiment runtime host tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I tests/stubs tests/experiment_runtime_test.cpp -o /tmp/experiment_runtime_test
          /tmp/experiment_runtime_test
      - name: Thread-bound BLE command inbox host tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/rgb_command_inbox_test.cpp -o /tmp/rgb_command_inbox_test
          /tmp/rgb_command_inbox_test
      - name: Bounded BLE GPIO read-only telemetry host tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/gpio_telemetry_codec_test.cpp -o /tmp/gpio_telemetry_codec_test
          /tmp/gpio_telemetry_codec_test
      - name: RGB PWM live GPIO reassignment host tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I tests/stubs tests/rgb_pin_reassign_test.cpp -o /tmp/rgb_pin_reassign_test
          /tmp/rgb_pin_reassign_test
      - name: Modular hardware component library host tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/component_modules_test.cpp -o /tmp/component_modules_test
          /tmp/component_modules_test
      - name: V18 replay-safe authorized GPIO apply host tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/component_apply_replay_guard_test.cpp -o /tmp/component_apply_replay_guard_test
          /tmp/component_apply_replay_guard_test
      - name: Component GPIO status authority host tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/component_status_test.cpp -o /tmp/component_status_test
          /tmp/component_status_test
      - name: Shared DHT11 production/probe core and interrupt regression
        run: |
          cmp firmware/esp32_rgb/core/DhtProbeCore.h tools/dht11_probe/DhtProbeCore.h
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/dht11_probe_test.cpp -o /tmp/dht11_probe_test
          /tmp/dht11_probe_test

      - name: Read-only diagnostics security contract
        run: python3 scripts/check-diagnostics-contract.py
      - name: Production release safety gate
        run: python3 scripts/check-release-safety.py
      - name: V5 local Arduino sketch packaging tests (offline, no flash)
        run: python3 -m unittest discover -s tests -p 'test_build_user_sketch.py' -v
      - name: Complete Arduino sketch ZIP regression
        run: python3 -m unittest discover -s tests -p 'test_package_esp32_source.py' -v
      - name: OTA slot budget logic regression
        run: python3 scripts/check-firmware-budget.py --self-test
      - name: V4 read-only BLE identity contract
        run: python3 scripts/check-v4-ble-id.py
      - name: V4 identity and truthful security capability gate
        run: python3 scripts/check-v4-identity.py
      - name: V4 device identity codec host tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/device_identity_test.cpp -o /tmp/device_identity_test
          /tmp/device_identity_test
      - name: V4 RGB persistence codec regression
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/rgb_persistence_test.cpp -o /tmp/rgb_persistence_test
          /tmp/rgb_persistence_test
      - name: RGB command codec host regression
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/rgb_command_codec_test.cpp -o /tmp/rgb_command_codec_test
          /tmp/rgb_command_codec_test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK (runner-installed command-line tools)
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK command-line tools not found in $SDK"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android platform
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unit tests
        working-directory: android
        run: gradle testDebugUnitTest --stacktrace
      - name: Compile navigation UI tests (no emulator required)
        working-directory: android
        run: gradle assembleDebugAndroidTest --stacktrace
      - name: Android lint
        working-directory: android
        run: gradle lintDebug --stacktrace
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace
      - name: Prepare APK test manifest
        run: |
          cd android/app/build/outputs/apk/debug
          sha256sum app-debug.apk > SHA256SUMS.txt
          echo "Git commit: $GITHUB_SHA" > build-info.txt
          echo "DEBUG LAB ONLY — not authorized for public release" >> build-info.txt
      - name: Upload APK and checksums
        uses: actions/upload-artifact@v4
        with:
          name: rgb-controller-debug
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
            android/app/build/outputs/apk/debug/build-info.txt

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 board
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          . ./config/esp32-board.env
          arduino-cli core install "esp32:esp32@$ARDUINO_ESP32_CORE" --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Install OLED display libraries for actual firmware build
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "Adafruit BusIO" "Adafruit GFX Library" "Adafruit SSD1306"
      - name: Compile firmware
        run: |
          . ./config/esp32-board.env
          arduino-cli compile --fqbn "$ARDUINO_FQBN" --output-dir build/firmware firmware/esp32_rgb
      - name: Compile connected full-lab firmware (DHT11 + LDR + OLED + DFPlayer)
        run: |
          . ./config/esp32-board.env
          arduino-cli compile --fqbn "$ARDUINO_FQBN" --build-property "compiler.cpp.extra_flags=-DCOMPI_FULL_LAB_PROFILE=1" --output-dir build/firmware-full-lab firmware/esp32_rgb
          python3 scripts/check-firmware-budget.py build/firmware-full-lab
          echo "Git commit: $GITHUB_SHA" > build/firmware-full-lab/build-info.txt
          echo "COMPI_FULL_LAB_PROFILE=1 (GPIO16 DHT11, GPIO32 LDR, OLED 21/22, DFPlayer 17/18)" >> build/firmware-full-lab/build-info.txt
          echo "LAB ONLY — confirm speaker, UART voltage levels and power before flashing" >> build/firmware-full-lab/build-info.txt
          (cd build/firmware-full-lab && sha256sum ./*.bin > SHA256SUMS.txt)
      - name: Upload connected full-lab binary
        uses: actions/upload-artifact@v4
        with:
          name: esp32-full-lab-dht11-ldr-oled-dfplayer
          if-no-files-found: error
          path: |
            build/firmware-full-lab/*.bin
            build/firmware-full-lab/SHA256SUMS.txt
            build/firmware-full-lab/build-info.txt
      - name: Compile standalone DHT11 diagnostic (no Wi-Fi/BLE/app)
        run: |
          . ./config/esp32-board.env
          arduino-cli compile --fqbn "$ARDUINO_FQBN" --output-dir build/dht11-probe tools/dht11_probe
      - name: Package standalone DHT11 diagnostic
        run: |
          mkdir -p build/dht11-probe-package/dht11_probe
          cp tools/dht11_probe/dht11_probe.ino tools/dht11_probe/DhtProbeCore.h build/dht11-probe-package/dht11_probe/
          cp tools/dht11_probe/README.md build/dht11-probe-package/
          (cd build/dht11-probe-package && zip -qr ../dht11-probe-source.zip .)
          (cd build/dht11-probe && sha256sum ./*.bin > SHA256SUMS.txt)
          echo "Git commit: $GITHUB_SHA" > build/dht11-probe/build-info.txt
          echo "Isolated diagnostic only — reflashing replaces Compi temporarily" >> build/dht11-probe/build-info.txt
      - name: Upload isolated DHT11 probe and source
        uses: actions/upload-artifact@v4
        with:
          name: dht11-standalone-diagnostic
          if-no-files-found: error
          path: |
            build/dht11-probe/*.bin
            build/dht11-probe/SHA256SUMS.txt
            build/dht11-probe/build-info.txt
            build/dht11-probe-source.zip
      - name: V4 WiFiProv Security2 compile-only feasibility probe
        run: |
          . ./config/esp32-board.env
          arduino-cli compile --fqbn "$ARDUINO_FQBN" --output-dir build/v4-probe firmware/v4_provisioning_probe
      - name: Verify V4 probe binary size
        run: python3 scripts/check-firmware-budget.py build/v4-probe --app-name v4_provisioning_probe.ino.bin
      - name: V4 private personalization kit regression
        run: python3 scripts/test-v4-provisioning-kit.py
      - name: V4 personalized BLE provisioning compile-only gate
        run: |
          . ./config/esp32-board.env
          python3 scripts/create-v4-provisioning-kit.py --out build/v4-private-kit
          mkdir -p firmware/esp32_rgb/config
          cp build/v4-private-kit/FactoryProvisioning.h firmware/esp32_rgb/config/FactoryProvisioning.h
          arduino-cli compile --fqbn "$ARDUINO_FQBN" --output-dir build/v4-provisioning-check firmware/esp32_rgb
          python3 scripts/check-firmware-budget.py build/v4-provisioning-check
          rm -f firmware/esp32_rgb/config/FactoryProvisioning.h
          echo "V4 personalized provisioning build compiled; NEVER package this CI test image."
      - name: Check firmware fits dual OTA slot
        run: python3 scripts/check-firmware-budget.py build/firmware
      - name: Package complete Arduino sketch source (no personalization)
        run: python3 scripts/package-esp32-source.py --out build/firmware/compi-esp32-source.zip
      - name: Prepare firmware test manifest
        run: |
          . ./config/esp32-board.env
          (
            echo "Git commit: $GITHUB_SHA"
            echo "Board: $ARDUINO_FQBN"
            echo "Arduino ESP32 core: $ARDUINO_ESP32_CORE"
            echo "LAB ONLY — no signed OTA, no physical validation"
          ) > build/firmware/build-info.txt
          cd build/firmware
          sha256sum ./*.bin ./compi-esp32-source.zip > SHA256SUMS.txt
      - name: Upload firmware for supervised testing
        uses: actions/upload-artifact@v4
        with:
          name: esp32-lab-4mb-firmware
          if-no-files-found: error
          path: |
            build/firmware/*.bin
            build/firmware/compi-esp32-source.zip
            build/firmware/SHA256SUMS.txt
            build/firmware/build-info.txt
